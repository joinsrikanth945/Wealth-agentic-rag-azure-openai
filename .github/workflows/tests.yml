name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:          # documentation-only changes don't rebuild or redeploy
      - "README.md"
      - "LICENSE"
      - "img*.png"
  pull_request:            # pull requests run the checks only, never deploy

concurrency:
  group: deploy-main       # one pipeline at a time
  cancel-in-progress: false

env:
  IMAGE: docker.io/joinsrikanth945/agentic-rag
  RESOURCE_GROUP: agentic-rag-rg
  CONTAINER_APP: agentic-rag

jobs:
  # 1. Tests + coverage, then code quality analysis with SonarQube Cloud
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-key-not-used     # placeholders: every test fakes the outside services
      PINECONE_API_KEY: test-key-not-used
      TAVILY_API_KEY: test-key-not-used
      ADMIN_API_KEY: test-admin-key
    steps:
      - name: Check out the code (full history for Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Tesseract OCR (used by the OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-mock httpx pytest-cov

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: SonarQube Cloud analysis (report only for now)
        uses: SonarSource/sonarqube-scan-action@v7
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 2. Scan the repository for committed secrets (blocks deployment)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Scan Python dependencies for known vulnerabilities (blocks deployment)
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit dependencies with pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc

  # 4. Build the image, scan it with Trivy, then push (only after all checks pass, only on main)
  build-and-push:
    needs: [test, secret-scan, dependency-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Scan the image with Trivy (fail on high or critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # 5. Deploy to Azure Container Apps, then smoke-test the live app
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.smoke.outputs.url }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy the new image
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}"

      - name: Smoke test the live app
        id: smoke
        run: |
          FQDN=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
                 --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://$FQDN"
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 18); do
            for path in /health /api/health; do
              if curl -fsS --max-time 20 "https://$FQDN$path" > /dev/null; then
                echo "Smoke test passed: https://$FQDN$path responded"
                exit 0
              fi
            done
            echo "Attempt $i: not ready yet, waiting 10 seconds..."
            sleep 10
          done
          echo "Smoke test failed: the deployed app did not respond"
          exit 1

  # 6. End-to-end tests: a real browser (Playwright) against the freshly deployed app
  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright and Chromium
        run: |
          pip install pytest pytest-playwright
          python -m playwright install --with-deps chromium

      - name: Run end-to-end tests against the live deployment
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.url }}
        run: pytest tests/e2e -v --tracing retain-on-failure --screenshot only-on-failure --output test-results

      - name: Upload screenshots and traces of failed tests
          if: failure()
          uses: actions/upload-artifact@v4
          with:
            name: e2e-test-results
            path: test-results/
            retention-days: 7


      e2e-ts:
        needs: deploy
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: e2e-ts
        steps:
          - name: Check out the code
            uses: actions/checkout@v4

          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
              node-version: "22"
              cache: npm
              cache-dependency-path: e2e-ts/package-lock.json

          - name: Install dependencies and Chromium
            run: |
              npm ci
              npx playwright install --with-deps chromium

          - name: Run TypeScript end-to-end tests against the live deployment
            env:
              E2E_BASE_URL: ${{ needs.deploy.outputs.url }}
            run: npx playwright test

          - name: Upload the HTML report
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: playwright-ts-report
              path: e2e-ts/playwright-report/
              retention-days: 7