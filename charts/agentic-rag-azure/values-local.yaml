# Local kind/minikube cluster: image built on your machine, one pod, small requests.
#   helm upgrade --install agentic-rag-azure ./charts/agentic-rag-azure -n agentic-rag-azure -f charts/agentic-rag-azure/values-local.yaml
replicaCount: 1

image:
  repository: agentic-rag-azure
  tag: local
  pullPolicy: IfNotPresent

ingress:
  host: agentic-rag-azure.localtest.me

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

autoscaling:
  minReplicas: 1
  maxReplicas: 2

podDisruptionBudget:
  enabled: false

serviceMonitor:
  enabled: true

grafanaDashboard:
  enabled: true
