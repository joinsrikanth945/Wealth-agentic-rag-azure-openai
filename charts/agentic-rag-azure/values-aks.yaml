# Azure Kubernetes Service: the image CI pushes to Docker Hub, 2-5 pods.
#   helm upgrade --install agentic-rag-azure ./charts/agentic-rag-azure -n agentic-rag-azure \
#     -f charts/agentic-rag-azure/values-aks.yaml --set image.tag=<commit-sha>
image:
  repository: docker.io/joinsrikanth945/agentic-rag
  tag: latest
  pullPolicy: Always

ingress:
  host: agentic-rag-azure.example.com   # your DNS name, e.g. <label>.<region>.cloudapp.azure.com

serviceMonitor:
  enabled: true

grafanaDashboard:
  enabled: true
