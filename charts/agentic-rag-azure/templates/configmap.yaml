apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic-rag-azure.fullname" . }}
  labels:
    {{- include "agentic-rag-azure.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Writable paths on the mounted volume (the root filesystem is read-only)
  AUDIT_DB_PATH: "/var/lib/agentic-rag-azure/audit.db"
  UPLOAD_DIR: "/var/lib/agentic-rag-azure/uploads"
  HOME: "/tmp"
