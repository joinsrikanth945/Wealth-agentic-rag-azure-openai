{{- if .Values.networkPolicy.enabled }}
# In: the app port only. Out: DNS and HTTPS only (Azure OpenAI, Pinecone, Tavily).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic-rag-azure.fullname" . }}
  labels:
    {{- include "agentic-rag-azure.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic-rag-azure.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
