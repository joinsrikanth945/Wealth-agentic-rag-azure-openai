# Azure Kubernetes Service: the image CI pushes to Docker Hub, 2-5 pods.
#   helm upgrade --install agentic-rag ./charts/agentic-rag -n agentic-rag \
#     -f charts/agentic-rag/values-aks.yaml --set image.tag=<commit-sha>
image:
  repository: docker.io/joinsrikanth945/agentic-rag
  tag: latest
  pullPolicy: Always

ingress:
  host: agentic-rag.example.com   # your DNS name, e.g. <label>.<region>.cloudapp.azure.com

serviceMonitor:
  enabled: true

grafanaDashboard:
  enabled: true
