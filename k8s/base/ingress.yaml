# Routed by the ingress-nginx controller. The host is set per environment by the overlays.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-rag
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"      # document uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"   # agent answers can take a while
spec:
  ingressClassName: nginx
  rules:
    - host: agentic-rag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentic-rag
                port:
                  name: http
