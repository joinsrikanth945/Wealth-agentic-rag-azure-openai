# Base manifests shared by every environment.
# Environments (overlays/local, overlays/aks) only change the image, host and sizing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentic-rag-azure

labels:
  - pairs:
      app.kubernetes.io/name: agentic-rag-azure
      app.kubernetes.io/part-of: wealth-agentic-rag-azure
    includeSelectors: true

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
