# Non-secret settings, read by app/core/config.py (pydantic-settings maps NAME -> name).
# API keys live in the Secret "agentic-rag-secrets" (see k8s/README.md), never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-rag-config
data:
  APP_ENV: "production"
  PORT: "8080"
  # "azure" uses Azure OpenAI (AZURE_OPENAI_* settings); "openai" uses OpenAI directly
  LLM_PROVIDER: "azure"
  # Writable paths: the container's root filesystem is read-only,
  # so the audit database and uploads go to the mounted volume
  AUDIT_DB_PATH: "/var/lib/agentic-rag/audit.db"
  UPLOAD_DIR: "/var/lib/agentic-rag/uploads"
  # Libraries that cache files (e.g. tokenizers) write under HOME
  HOME: "/tmp"
